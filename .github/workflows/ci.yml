name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes (Vitest)
        run: npx ng test --watch=false
      - name: Build de produção
        run: npx ng build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes unitários e de integração
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o extrator e o servidor MCP Brasil
        env:
          GEMINI_API_KEY: chave-de-ci
        run: docker compose up -d --build
      - name: Interface, exemplos e API respondem
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8080/api/info && break; sleep 2; done
          curl -sf localhost:8080/api/info | grep -q '"provedor":"google-genai"'
          curl -sf localhost:8080/ | grep -q '<app-root>'
          curl -sf -o /dev/null localhost:8080/exemplos/boleto-adulterado.pdf
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
